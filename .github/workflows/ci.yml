name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mkchain
          POSTGRES_PASSWORD: mkchain123
          POSTGRES_DB: mkchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mkchain -d mkchain" --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend deps
        working-directory: ./
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://mkchain:mkchain123@localhost:5432/mkchain
        run: |
          python -m alembic -c alembic.ini upgrade head

      - name: Run backend smoke tests
        env:
          DATABASE_URL: postgresql://mkchain:mkchain123@localhost:5432/mkchain
        run: |
          # Placeholder: run any backend tests if present
          echo "No backend tests yet"
